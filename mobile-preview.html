<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preview Mobile ARQ90</title>
  <style>
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; display:grid; place-items:center;
      background:#111214; font-family:system-ui, sans-serif;
    }
    .phone {
      width:390px; height:844px; overflow:hidden; border:10px solid #2c2c2c;
      border-radius:32px; background:#f2f0ec; box-shadow:0 24px 80px rgba(0,0,0,.45);
    }
    iframe { display:block; width:100%; height:100%; border:0; }
    @media (max-width:440px) {
      body { display:block; background:#f2f0ec; }
      .phone { width:100vw; height:100vh; border:0; border-radius:0; box-shadow:none; }
    }
  </style>
</head>
<body>
  <div class="phone">
    <iframe src="index.html?mobile-preview=3" title="Preview mobile da landing ARQ90"></iframe>
  </div>
</body>
</html>
